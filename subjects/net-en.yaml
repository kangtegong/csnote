                references:
                  - 혼자_공부하는_네트워크/314_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/461_페이지
                superscript: Content-Length (HTTP 헤더)
              - term: Content-Type (HTTP Header)
                description: An HTTP header specifying the media type used in the message body.
                references:
                  - 혼자_공부하는_네트워크/315_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/462_페이지
                superscript: Content-Type (HTTP 헤더)
              - term: Content-Language (HTTP Header)
                description: An HTTP header specifying the natural language used in the message body.
                references:
                  - 혼자_공부하는_네트워크/315_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/462_페이지
                superscript: Content-Language (HTTP 헤더)
              - term: Content-Encoding (HTTP Header)
                description: An HTTP header specifying how the message body was compressed or transformed.
                references:
                  - 혼자_공부하는_네트워크/316_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/462_페이지
                superscript: Content-Encoding (HTTP 헤더)
              - term: Cache
                description: A technique that temporarily stores a copy of information to prevent unnecessary bandwidth waste and response delays.
                superscript: 캐시
                references:
                  - 혼자_공부하는_네트워크/317_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/467_페이지
              - term: Private Cache
                description: A cache stored in the web browser.
                superscript: 개인 전용 캐시
                references:
                  - 혼자_공부하는_네트워크/317_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/468_페이지
              - term: Public Cache
                description: A cache stored in an intermediate server located between the client and the server.
                superscript: 공용 캐시
                references:
                  - 혼자_공부하는_네트워크/317_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/468_페이지
              - term: Cache Freshness
                description: A metric indicating how similar the cached copy data is to the latest original data.
                superscript: 캐시 신선도
                references:
                  - 혼자_공부하는_네트워크/318_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/469_페이지
              - term: Entity Tag (ETag)
                description: Information used in caching to identify the version of a resource.
                superscript: 엔티티 태그
                references:
                  - 혼자_공부하는_네트워크/322_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/471_페이지
              - term: Version
                description: A meaningful change.
                superscript: 버전
                references:
                  - 혼자_공부하는_네트워크/322_페이지
              - term: Cookie
                description: Data created by the server and stored on the client side; a means of supplementing HTTP's stateless characteristic.
                superscript: 쿠키
                references:
                  - 혼자_공부하는_네트워크/323_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/464_페이지
                image: assets/img/net/cookie.png
              - term: Session ID
                description: A unique identifier for identifying a session, the connection state between a client and a server.
                superscript: 세션 아이디
                references:
                  - 혼자_공부하는_네트워크/324_페이지
              - term: Session Authentication
                description: An authentication method using sessions.
                superscript: 세션 인증
                references:
                  - 혼자_공부하는_네트워크/324_페이지
              - term: Expires/Max-Age
                description: A cookie attribute value indicating the cookie's validity period.
                references:
                  - 혼자_공부하는_네트워크/327_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/466_페이지
                superscript: Expires/Max-Age
              - term: Secure
                description: A cookie attribute value that allows a cookie to be transmitted only when the HTTPS protocol is used.
                references:
                  - 혼자_공부하는_네트워크/327_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/466_페이지
                superscript: Secure
              - term: HttpOnly
                description: An attribute that restricts cookie use to HTTP transmission only; a cookie attribute value that prevents access to the cookie from JavaScript.
                references:
                  - 혼자_공부하는_네트워크/327_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/466_페이지
                superscript: HttpOnly
              - term: Web Storage
                description: 'Storage space within the web browser that can store larger data than cookies (types: local storage and session storage).'
                superscript: 웹 스토리지
                references:
                  - 혼자_공부하는_네트워크/328_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/467_페이지
              - term: Local Storage
                description: Information that can be stored permanently unless separately deleted.
                superscript: 로컬 스토리지
                references:
                  - 혼자_공부하는_네트워크/328_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/467_페이지
              - term: Session Storage
                description: Information that is retained while the session is maintained (while the browser is open).
                superscript: 세션 스토리지
                references:
                  - 혼자_공부하는_네트워크/328_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/467_페이지
              - term: Content Negotiation
                description: A mechanism that provides the most appropriate form of a resource for the same URI.
                superscript: 콘텐츠 협상
                references:
                  - 혼자_공부하는_네트워크/329_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/472_페이지
              - term: Representation of a Resource
                description: The transmittable form of a resource.
                superscript: 자원의 표현
                references:
                  - 혼자_공부하는_네트워크/329_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/472_페이지
              - term: Accept Header (HTTP Header)
                description: An HTTP header for indicating the preferred media type.
                references:
                  - 혼자_공부하는_네트워크/329_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/473_페이지
                superscript: Accept 헤더 (HTTP 헤더)
              - term: Accept-Language Header (HTTP Header)
                description: An HTTP header for indicating the preferred language.
                references:
                  - 혼자_공부하는_네트워크/329_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/473_페이지
                superscript: Accept-Language 헤더 (HTTP 헤더)
              - term: Accept-Charset Header (HTTP Header)
                description: An HTTP header for indicating the preferred character encoding scheme.
                references:
                  - 혼자_공부하는_네트워크/329_페이지
                superscript: Accept-Charset 헤더 (HTTP 헤더)
              - term: Accept-Encoding Header (HTTP Header)
                description: An HTTP header for indicating the preferred compression scheme.
                references:
                  - 혼자_공부하는_네트워크/329_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/473_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/473_페이지
                superscript: Accept-Encoding 헤더 (HTTP 헤더)
      - subtitle: 네트워크 심화
        content:
          - subsubtitle: 안정성을 위한 기술
            items:
              - term: Availability
                description: The proportion of time a computer system can actually perform a particular function.
                superscript: 가용성
                references:
                  - 혼자_공부하는_네트워크/383_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/481_페이지
              - term: High Availability
                description: The property of having high availability.
                superscript: 고가용성
                references:
                  - 혼자_공부하는_네트워크/383_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/481_페이지
              - term: Uptime
                description: The time of normal use.
                superscript: 업타임
                references:
                  - 혼자_공부하는_네트워크/383_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/482_페이지
              - term: Downtime
                description: The time during which normal use is impossible.
                superscript: 다운타임
                references:
                  - 혼자_공부하는_네트워크/383_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/482_페이지
              - term: Fault Tolerance
                description: The ability to function even when a problem occurs.
                superscript: 결함 감내
                references:
                  - 혼자_공부하는_네트워크/384_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/483_페이지
              - term: Redundancy
                description: A technique of duplicating a particular system; a technique of preparing a backup to tolerate faults and increase availability.
                references:
                  - 혼자_공부하는_네트워크/384_페이지
                superscript: 이중화
              - term: Single Point of Failure (SPoF)
                description: An object whose failure can bring down the entire system.
                superscript: 단일 장애점 (SPoF)
                references:
                  - 혼자_공부하는_네트워크/385_페이지
              - term: Active-Standby
                description: Active means the operating state, and standby means the state of waiting as a backup for the active; that is, a redundancy configuration in which one system operates while another is left on standby for backup.
                superscript: 액티브/스탠바이
                references:
                  - 혼자_공부하는_네트워크/385_페이지
              - term: Active-Active
                description: A configuration in which both systems are left in the operating state.
                superscript: 액티브/액티브
                references:
                  - 혼자_공부하는_네트워크/385_페이지
              - term: Failover
                description: A function that automatically switches to the prepared standby system when a problem occurs in the active system.
                superscript: 페일오버
                references:
                  - 혼자_공부하는_네트워크/385_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/483_페이지
              - term: Multiplexing (Multiplication)
                description: A technique of having several of a particular system.
                references:
                  - 혼자_공부하는_네트워크/386_페이지
                superscript: 다중화
              - term: Teaming
                description: A technique that makes redundant/multiple network interfaces (NICs) appear as a single interface with better, more stable performance; a term mainly used in Windows.
                superscript: 티밍
                references:
                  - 혼자_공부하는_네트워크/387_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/377_페이지
              - term: Bonding
                description: A technique that makes redundant/multiple network interfaces (NICs) appear as a single interface with better, more stable performance; a term mainly used in Linux.
                superscript: 본딩
                references:
                  - 혼자_공부하는_네트워크/387_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/377_페이지
              - term: Traffic
                description: The amount of packets passing through a particular node at a given time.
                superscript: 트래픽
                references:
                  - 혼자_공부하는_네트워크/387_페이지
              - term: Load Balancing
                description: A technique performed by a load balancer to distribute traffic evenly; a combination of 'load' and 'balancing'.
                superscript: 로드 밸런싱
                references:
                  - 혼자_공부하는_네트워크/388_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/484_페이지
                image: assets/img/net/load_balancing.png
              - term: Health Check
                description: A function that periodically checks whether a system is in a state able to correctly respond to current requests.
                superscript: 헬스 체크
                references:
                  - 혼자_공부하는_네트워크/389_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/484_페이지
              - term: Heartbeat
                description: A method in which servers periodically exchange heartbeat messages and detect a problem when the signal is cut off.
                superscript: 하트비트
                references:
                  - 혼자_공부하는_네트워크/389_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/484_페이지
              - term: Round Robin Algorithm (Load Balancing Algorithm)
                description: A load balancing algorithm that simply distributes load by rotating among servers.
                superscript: 라운드 로빈 알고리즘 (로드 밸런싱 알고리즘)
                references:
                  - 혼자_공부하는_네트워크/389_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/485_페이지
              - term: Least Connection Algorithm (Load Balancing Algorithm)
                description: A load balancing algorithm that delivers load preferentially to the server with the fewest connections.
                superscript: 최소 연결 알고리즘 (로드 밸런싱 알고리즘)
                references:
                  - 혼자_공부하는_네트워크/389_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/485_페이지
              - term: Weighted Round Robin Algorithm (Load Balancing Algorithm)
                description: A load balancing algorithm that operates by round robin but lets servers with higher weights be selected more often and receive more load.
                superscript: 가중치 라운드 로빈 알고리즘 (로드 밸런싱 알고리즘)
                references:
                  - 혼자_공부하는_네트워크/390_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/485_페이지
              - term: Weighted Least Connection Algorithm (Load Balancing Algorithm)
                description: A load balancing algorithm that operates by least connection but lets servers with higher weights be selected more often and receive more load.
                superscript: 가중치 최소 연결 알고리즘 (로드 밸런싱 알고리즘)
                references:
                  - 혼자_공부하는_네트워크/390_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/485_페이지
              - term: Origin Server
                description: An HTTP server that can create resources and send authoritative responses to clients.
                superscript: 오리진 서버
                references:
                  - 혼자_공부하는_네트워크/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/480_페이지
              - term: Inbound Message
                description: A message heading toward the origin server.
                superscript: 인바운드 메시지
                references:
                  - 혼자_공부하는_네트워크/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/493_페이지
              - term: Outbound Message
                description: A message heading toward the client.
                superscript: 아웃바운드 메시지
                references:
                  - 혼자_공부하는_네트워크/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/493_페이지
              - term: Proxy
                description: A message-forwarding agent chosen by the client, an intermediate server located near the client; it mainly provides functions such as cache storage, client encryption, and access restriction.
                superscript: 프록시
                references:
                  - 혼자_공부하는_네트워크/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/481_페이지
                image: assets/img/net/forward_proxy.png
              - term: Gateway
                description: An intermediate server that acts as an entrance enabling communication between networks, located near the origin server; also called a reverse proxy.
                superscript: 게이트웨이
                references:
                  - 혼자_공부하는_네트워크/392_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/482_페이지
                image: assets/img/net/reverse_proxy.png
          - subsubtitle: 안전성을 위한 기술
            items:
              - term: Encryption
                description: The process of changing original data into an unrecognizable form.
                superscript: 암호화
                references:
                  - 혼자_공부하는_네트워크/394_페이지
              - term: Decryption
                description: The process of restoring encrypted data back to the original data.
                superscript: 복호화
                references:
                  - 혼자_공부하는_네트워크/394_페이지
              - term: Symmetric Key Encryption
                description: An encryption method that uses the same encryption key for encryption and decryption.
                superscript: 대칭 키 암호화
                references:
                  - 혼자_공부하는_네트워크/395_페이지
              - term: Public Key Encryption
                description: An encryption method that uses different keys for encryption and decryption; also called asymmetric key encryption.
                superscript: 공개 키 암호화
                references:
                  - 혼자_공부하는_네트워크/396_페이지
              - term: Asymmetric Key Encryption
                description: An encryption method that uses different keys for encryption and decryption; also called public key encryption.
                superscript: 비대칭 키 암호화
                references:
                  - 혼자_공부하는_네트워크/396_페이지
              - term: Certificate
                description: A document for proving something.
                superscript: 인증서
                references:
                  - 혼자_공부하는_네트워크/398_페이지
                  - 혼자_공부하는_네트워크/479_페이지
                image: assets/img/net/certificate.png
              - term: Public Key Certificate
                description: An electronic document for proving a public key and its validity.
                superscript: 공개키 인증서
                references:
                  - 혼자_공부하는_네트워크/399_페이지
              - term: Certification Authority (CA)
                description: An accredited organization that can perform roles such as issuing, verifying, and storing certificates.
                superscript: 인증 기관 (CA)
                references:
                  - 혼자_공부하는_네트워크/399_페이지
                  - 혼자_공부하는_네트워크/478_페이지
              - term: Signature
                description: The CA's information guaranteeing the issued certificate.
                superscript: 서명값
                references:
                  - 혼자_공부하는_네트워크/399_페이지
              - term: Fingerprint
                description: The hash value of the certificate's contents.
                superscript: 지문
                references:
                  - 혼자_공부하는_네트워크/400_페이지
              - term: Hash Value
                description: The result value of applying a hash function.
                references:
                  - 혼자_공부하는_네트워크/400_페이지
                superscript: 해시 값
              - term: Hash Function
                description: A function that converts data of arbitrary length into data of fixed length.
                references:
                  - 혼자_공부하는_네트워크/400_페이지
                superscript: 해시 함수
              - term: Digital Signature
                description: A procedure that proves identity by decrypting, with a public key, a message encrypted with a private key.
                superscript: 디지털 서명
                references:
                  - 혼자_공부하는_네트워크/401_페이지
              - term: SSL (Secure Sockets Layer)
                description: A protocol that performs authentication and encryption.
                superscript: SSL
                references:
                  - 혼자_공부하는_네트워크/401_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/474_페이지
              - term: TLS (Transport Layer Security)
                description: A protocol that performs authentication and encryption, succeeding SSL.
                superscript: TLS
                references:
                  - 혼자_공부하는_네트워크/401_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/474_페이지
              - term: TLS Handshake
                description: Messages exchanged to perform TLS-based encrypted communication (e.g., HTTPS sets up TLS encrypted communication via a TLS handshake after establishing a TCP connection via a three-way handshake).
                superscript: TLS 핸드셰이크
                references:
                  - 혼자_공부하는_네트워크/401_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/475_페이지
                image: assets/img/net/tls.png
              - term: HTTPS (HTTP over TLS)
                description: A protocol developed for the safe transmission of HTTP messages.
                superscript: HTTPS
                references:
                  - 혼자_공부하는_네트워크/401_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/474_페이지
              - term: Cipher Suite
                description: Information containing the usable encryption methods and hash functions.
                superscript: 암호 스위트
                references:
                  - 혼자_공부하는_네트워크/403_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/476_페이지
              - term: Scale Up
                description: A method of improving performance by replacing equipment with better equipment.
                superscript: 스케일 업
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/486_페이지
                image: assets/img/net/scale_up.png
              - term: Scale Out
                description: A method of improving performance by adding more equipment.
                superscript: 스케일 아웃
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/486_페이지
                image: assets/img/net/scale_out.png
              - term: Vertical Scaling
                description: Another name for scale up.
                superscript: 수직적 확장
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/486_페이지
              - term: Horizontal Scaling
                description: Another name for scale out.
                superscript: 수평적 확장
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/486_페이지
              - term: Auto Scaling
                description: A technique that dynamically expands or shrinks a system whenever needed.
                superscript: 오토 스케일링
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/488_페이지
              - term: Upstream
                description: The direction of transmitting data toward the upper server (toward the origin server).
                superscript: 업스트림
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/493_페이지
              - term: Downstream
                description: The direction of transmitting data toward the lower server (toward the client).
                superscript: 다운스트림
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/493_페이지
              - term: Web Server
                description: An HTTP server that responds with static information (e.g., Apache, Nginx).
                superscript: 웹 서버
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/494_페이지
              - term: Web Application Server (WAS)
                description: An HTTP server that responds with dynamic information (e.g., Tomcat, JBoss).
                superscript: 웹 애플리케이션 서버
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/495_페이지
              - term: Socket (Network)
                description: An endpoint of network communication between processes; in many operating systems, a socket is handled like a file.
                superscript: 소켓 (네트워크)
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/497_페이지
                image: assets/img/net/socket.png
          - subsubtitle: 무선 네트워크
            items:
              - term: Radio Wave
                description: A kind of invisible electromagnetic wave with a frequency of roughly 3 kHz to 3 THz.
                superscript: 전파
                references:
                  - 혼자_공부하는_네트워크/409_페이지
              - term: Modulation
                description: Converting information into a signal of the desired form.
                superscript: 변조
                references:
                  - 혼자_공부하는_네트워크/411_페이지
              - term: Demodulation
                description: Converting a modulated signal back into the original information.
                superscript: 복조
                references:
                  - 혼자_공부하는_네트워크/411_페이지
              - term: Frequency Band
                description: A particular range of frequencies.
                references:
                  - 혼자_공부하는_네트워크/411_페이지
                superscript: 주파수 대역
              - term: IEEE 802.11
                description: The standard specification for wireless LAN.
                references:
                  - 혼자_공부하는_네트워크/412_페이지
                superscript: IEEE 802.11
              - term: Wi-Fi
                description: A wireless LAN technology that follows particular IEEE 802.11 standards.
                superscript: 와이파이
                references:
                  - 혼자_공부하는_네트워크/412_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/372_페이지
              - term: 5GHz Wi-Fi
                description: Faster in send/receive speed than 2.4 GHz Wi-Fi, but more affected by obstacles.
                references:
                  - 혼자_공부하는_네트워크/413_페이지
                superscript: 5GHz 와이파이
              - term: 2.4GHz Wi-Fi
                description: Slower in send/receive speed than 5 GHz Wi-Fi, but less affected by obstacles.
                references:
                  - 혼자_공부하는_네트워크/413_페이지
                superscript: 2.4GHz 와이파이
              - term: Diffraction
                description: A phenomenon in which a wave propagates around to the far side when it passes an obstacle or a narrow gap.
                references:
                  - 혼자_공부하는_네트워크/413_페이지
                superscript: 회절성
              - term: Channel
                description: A particular frequency band to be used in a wireless network; each channel is distinguished by a number.
                superscript: 채널
                references:
                  - 혼자_공부하는_네트워크/414_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/374_페이지
              - term: Access Point (AP)
                description: A device that connects wireless communication devices to form a wireless network.
                superscript: AP
                references:
                  - 혼자_공부하는_네트워크/415_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/375_페이지
              - term: Infrastructure Mode
                description: A wireless network communication mode in which communication takes place via an AP.
                superscript: 인프라스트럭처 모드
                references:
                  - 혼자_공부하는_네트워크/415_페이지
              - term: Ad Hoc Mode
                description: A wireless communication mode in which hosts communicate one-to-one without the intervention of an AP.
                superscript: 애드 혹 모드
                references:
                  - 혼자_공부하는_네트워크/415_페이지
              - term: Service Set
                description: The set of an AP and the various devices forming a wireless network; devices in the same service set belong to the same wireless network.
                superscript: 서비스 셋
                references:
                  - 혼자_공부하는_네트워크/415_페이지
              - term: Service Set Identifier (SSID)
                description: A means of distinguishing a wireless network and the unique name referring to it.
                superscript: 서비스 셋 식별자(SSID)
                references:
                  - 혼자_공부하는_네트워크/416_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/375_페이지
              - term: Basic Service Set (BSS)
                description: A wireless LAN composed of a single AP.
                superscript: BSS (무선 네트워크)
                references:
                  - 혼자_공부하는_네트워크/416_페이지
              - term: Extended Service Set (ESS)
                description: A wireless LAN composed of multiple APs.
                superscript: ESS (무선 네트워크)
                references:
                  - 혼자_공부하는_네트워크/416_페이지
              - term: Beacon Frame
                description: A broadcast message that an AP periodically transmits to announce its existence.
                superscript: 비컨 프레임
                references:
                  - 혼자_공부하는_네트워크/416_페이지
