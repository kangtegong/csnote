          - term: Sharding
            description: A technique that distributes partitioned tables across separate database servers to efficiently manage large-scale data.
            superscript: 샤딩
            references:
              - 이것이_취업을_위한_컴퓨터과학이다/625_페이지
            image: assets/img/db/sharding.png
          - term: Shard
