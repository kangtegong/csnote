sections:
  - title: 운영체제
    content:
      - subtitle: 운영체제 시작하기
        content:
          - subsubtitle: 운영체제를 알아야 하는 이유
            items:
              - term: System Resource
                description: An element that is naturally required to run a program.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/261_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/135_페이지
                superscript: 시스템 자원
              - term: Operating System
                description: A special program that allocates the resources needed by the programs to be run and helps programs execute correctly.
                superscript: 운영체제
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/261_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/134_페이지
                image: assets/img/os/os.png
              - term: Kernel
                description: The core part of the operating system that manages resources including hardware, as well as processes and threads.
                superscript: 커널
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/261_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/138_페이지
              - term: Kernel Space
                description: The region in memory where the kernel is loaded.
                superscript: 커널 영역
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/261_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/138_페이지
                image: assets/img/os/kernel_space.png
              - term: User Space
                description: The region other than kernel space, where the application programs used by the user are loaded.
                superscript: 사용자 영역
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/261_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/138_페이지
                image: assets/img/os/kernel_space.png
              - term: Application Software
                description: A general-purpose program that a user uses for a specific purpose.
                superscript: 응용 프로그램
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/262_페이지
          - subsubtitle: 운영체제의 큰 그림
            items:
              - term: Kernel
                description: The core part of the operating system, with functions to access and manipulate resources and to make programs run correctly and safely.
                superscript: 커널
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/269_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/134_페이지
              - term: User Interface (UI)
                description: A channel through which a user can interact with a computer, like the Windows desktop.
                superscript: 사용자 인터페이스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/269_페이지
              - term: Graphic User Interface (GUI)
                description: A user interface that lets users interact with a computer based on graphics.
                superscript: 그래픽 유저 인터페이스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/269_페이지
              - term: Command Line Interface (CLI)
                description: A user interface that lets users interact with a computer based on commands.
                superscript: 커맨드 라인 인터페이스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/269_페이지
              - term: Dual Mode
                description: A scheme that broadly divides the modes in which the CPU executes instructions into user mode and kernel mode.
                superscript: 이중 모드
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/272_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/141_페이지
              - term: User Mode
                description: An execution mode that cannot run kernel-space code, so it cannot be provided with operating system services.
                superscript: 사용자 모드
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/272_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/141_페이지
              - term: Kernel Mode
                description: An execution mode that can run kernel-space code, so it can be provided with operating system services.
                superscript: 커널 모드
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/273_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/141_페이지
              - term: System Call
                description: A way for an application running in user mode to switch to kernel mode in order to receive operating system services.
                superscript: 시스템 호출 (시스템 콜)
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/273_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/139_페이지
                image: assets/img/os/syscall.png
              - term: Software Interrupt
                description: An interrupt raised by a specific instruction that generates an interrupt.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/273_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/141_페이지
                superscript: 소프트웨어 인터럽트
              - term: Process
                description: A program in execution.
                superscript: 프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/275_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/137_페이지
              - term: CPU Scheduling
                description: The task of fairly allocating the CPU to processes; it decides which process uses the CPU first and for how long.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/276_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/135_페이지
                superscript: CPU 스케줄링
              - term: File System
                description: A program inside the operating system that stores and manages files.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/277_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/136_페이지
                superscript: 파일 시스템
              - term: Virtual Machine
                description: A virtual computer created in software.
                superscript: 가상 머신
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/278_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/241_페이지
              - term: Hypervisor
                description: Software that virtualizes hardware.
                superscript: 하이퍼바이저
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/241_페이지
              - term: Container
                description: A virtualization technology that behaves similarly to a virtual machine but runs more lightly and quickly.
                superscript: 컨테이너
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/241_페이지
              - term: Container Orchestration
                description: A technology that automatically deploys and manages multiple containers.
                superscript: 컨테이너 오케스트레이션
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/243_페이지
      - subtitle: 프로세스와 스레드
        content:
          - subsubtitle: 프로세스 개요
            items:
              - term: Foreground Process
                description: A process that runs in a space the user can see.
                superscript: 포그라운드 프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/285_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/144_페이지
              - term: Background Process
                description: A process that runs in a space the user cannot see.
                superscript: 백그라운드 프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/286_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/144_페이지
              - term: Daemon
                description: A background process in Unix-style operating systems that performs only its assigned tasks without interacting with the user.
                superscript: 데몬
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/286_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/144_페이지
              - term: Service
                description: A background process in the Windows operating system that performs only its assigned tasks without interacting with the user.
                superscript: 서비스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/286_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/144_페이지
              - term: Process Control Block (PCB)
                description: A data structure that stores identification information related to a process.
                superscript: 프로세스 제어 블록
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/287_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/146_페이지
              - term: Process Table
                description: A collection of PCBs.
                superscript: 프로세스 테이블
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/147_페이지
                image: assets/img/os/process_table.png
              - term: Process ID (PID)
                description: A unique number assigned to identify a process.
                superscript: 프로세스 ID (PID)
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/288_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/146_페이지
              - term: Context
                description: The information that must be remembered to resume the execution of a process.
                superscript: 문맥
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/290_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/149_페이지
              - term: Context Switching
                description: The process of backing up the existing process's context to its PCB, restoring the new process's context from its PCB, and running the new process.
                superscript: 문맥 교환
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/291_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/149_페이지
                image: assets/img/os/context_switch.png
              - term: Code Segment
                description: The memory region where instructions made of machine code (executable code) are stored.
                superscript: 코드 영역
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/292_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
              - term: Data Segment
                description: The memory region where data to be retained while the program runs is stored.
                superscript: 데이터 영역
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/292_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
              - term: BSS Segment
                description: The memory region where data to be retained while the program runs is stored; the region where uninitialized global variables are stored.
                superscript: BSS 영역
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
              - term: Global Variable
                description: A variable that persists while the program runs and can be accessed throughout the entire program.
                superscript: 전역 변수
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/293_페이지
              - term: Statically Allocated Region
                description: A region of fixed size in the process memory layout.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/293_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
                superscript: 정적 할당 영역
              - term: Dynamically Allocated Region
                description: A region of variable size in the process memory layout.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/293_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
                superscript: 동적 할당 영역
              - term: Heap Segment
                description: A storage space that the programmer can allocate directly; a kind of dynamically allocated region.
                superscript: 힙 영역
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/293_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
              - term: Memory Leak
                description: A phenomenon in which memory is allocated but not released, so unused memory keeps accumulating and wastes memory.
                superscript: 메모리 누수
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/293_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
              - term: Stack Segment
                description: A space for temporarily storing data; the region where parameters and local variables are stored; a kind of dynamically allocated region.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/294_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/145_페이지
                superscript: 스택 영역
              - term: Stack Trace
                description: Function-call information stored in the stack region.
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/146_페이지
                superscript: 스택 트레이스
          - subsubtitle: 프로세스 상태와 계층 구조
            items:
              - term: New State
                description: A state in which a process is being created.
                superscript: 생성 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/297_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/151_페이지
                image: assets/img/os/process_state.png
              - term: Ready State
                description: A state in which a process can be allocated the CPU and run, but is waiting because it is not yet its turn.
                superscript: 준비 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/297_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/151_페이지
                image: assets/img/os/process_state.png
              - term: Dispatch
                description: The transition of a process from the ready state to the running state.
                superscript: 디스패치
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/297_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/151_페이지
              - term: Running State
                description: A state in which a process has been allocated the CPU and is running.
                superscript: 실행 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/297_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/151_페이지
                image: assets/img/os/process_state.png
              - term: Blocked State
                description: A state in which execution is temporarily suspended, such as while waiting for an I/O device operation.
                superscript: 대기 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/297_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/151_페이지
                image: assets/img/os/process_state.png
              - term: Terminated State
                description: A state in which a process has ended.
                superscript: 종료 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/297_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/151_페이지
                image: assets/img/os/process_state.png
              - term: Parent Process
                description: A process that created another process through a system call during its execution.
                superscript: 부모 프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/298_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/140_페이지
              - term: Child Process
                description: A process created by a parent process.
                superscript: 자식 프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/298_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/140_페이지
              - term: Parent PID (PPID)
                description: The PID of the parent process.
                superscript: PPID
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/298_페이지
              - term: Process Hierarchy
                description: A structure in which processes are organized hierarchically.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/299_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/140_페이지
                superscript: 프로세스 계층 구조
              - term: fork
                description: A system call that creates a copy of the calling process itself as a child process.
                superscript: fork
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/301_페이지
              - term: exec
                description: A system call that overwrites the process's own memory space with a new program.
                superscript: exec
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/302_페이지
              - term: Timeout Interrupt
                description: An interrupt that occurs when a process uses the CPU for a set period of time; also called a timer interrupt.
                superscript: 타임아웃 인터럽트
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/148_페이지
              - term: Blocking I/O
                description: A scheme in which a process stays in the blocked state until the I/O operation completes.
                superscript: 블로킹 입출력
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/152_페이지
                image: assets/img/os/blocking_io.png
              - term: Non-Blocking I/O
                description: A scheme in which a process continues execution immediately after requesting an I/O operation, regardless of whether it has completed.
                superscript: 논블로킹 입출력
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/152_페이지
                image: assets/img/os/nonblocking_io.png
          - subsubtitle: 스레드
            items:
              - term: Thread
                description: A unit of execution flow that makes up a process.
                superscript: 스레드
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/306_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/137_페이지
                image: assets/img/os/thread.png
              - term: Single-Threaded Process
                description: A process composed of a single thread.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/307_페이지
                superscript: 단일 스레드 프로세스
              - term: Task
                description: A concept in Linux that encompasses both processes and threads.
                superscript: 테스크
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/309_페이지
              - term: Multiprocess
                description: An execution scheme that runs multiple processes simultaneously.
                superscript: 멀티프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/309_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/153_페이지
              - term: Multithread
                description: An execution scheme that runs a process with multiple threads simultaneously.
                superscript: 멀티스레드
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/309_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/155_페이지
              - term: Thread Join
                description: A feature in which one thread waits until another thread terminates.
                superscript: 스레드 조인
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/158_페이지
              - term: Inter-Process Communication (IPC)
                description: Methods for sharing resources and exchanging data between processes.
                superscript: 프로세스 간 통신
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/312_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/158_페이지
              - term: Shared Memory
                description: A memory region that processes can share.
                superscript: 공유 메모리
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/312_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/159_페이지
                image: assets/img/os/shared_memory.png
              - term: Message Passing
                description: A method of IPC in which processes exchange messages.
                superscript: 메시지 전달
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/161_페이지
                image: assets/img/os/message_passing.png
              - term: Anonymous Pipe
                description: A method of IPC for one-way communication; communication is possible only between a parent process and a child process.
                superscript: 익명 파이프
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/161_페이지
                image: assets/img/os/unnamed_pipe.png
              - term: Named Pipe
                description: A method of IPC; communication is possible even between processes other than parent and child.
                superscript: 지명 파이프
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/161_페이지
              - term: Signal
                description: A method of IPC that delivers a specific event between processes.
                superscript: 시그널
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/162_페이지
              - term: Signal Handler
                description: A function that handles a signal.
                superscript: 시그널 핸들러
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/162_페이지
              - term: Core Dump
                description: A feature that saves a process's memory information to a file when the process terminates abnormally.
                superscript: 코어 덤프
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/163_페이지
              - term: Remote Procedure Call (RPC)
                description: A technology for calling a procedure located on a remote machine.
                superscript: 원격 프로시저 호출(RPC)
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/164_페이지
      - subtitle: CPU 스케줄링
        content:
          - subsubtitle: CPU 스케줄링 개요
            items:
              - term: CPU Scheduling
                description: The process by which the operating system distributes CPU resources to processes fairly and reasonably.
                superscript: CPU 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/316_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/193_페이지
              - term: CPU Utilization
                description: A ratio indicating how much the CPU was used over a certain period of time.
                superscript: CPU 활용률
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/194_페이지
              - term: I/O-Bound Process
                description: A process that barely uses the CPU and spends most of its time on I/O operations.
                superscript: 입출력 집중 프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/317_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/195_페이지
              - term: CPU-Bound Process
                description: A process with heavy CPU workloads.
                superscript: CPU 집중 프로세스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/317_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/195_페이지
              - term: CPU Burst
                description: Work that uses the CPU.
                superscript: CPU 버스트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/318_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/194_페이지
              - term: I/O Burst
                description: Work that waits for an I/O device.
                superscript: 입출력 버스트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/318_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/194_페이지
              - term: Priority
                description: The criterion that decides which process to allocate the CPU to first when distributing CPU resources to processes.
                superscript: 우선순위
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/319_페이지
              - term: Scheduling Queue
                description: A queue that lines up processes wishing to use the CPU, processes wishing to be loaded into memory, processes wishing to use a particular I/O device, and so on.
                superscript: 스케줄링 큐
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/320_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/195_페이지
              - term: Ready Queue
                description: A queue where processes wishing to use the CPU wait.
                superscript: 준비 큐
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/321_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/196_페이지
              - term: Waiting Queue
                description: A queue where processes that have entered the blocked state to use an I/O device wait.
                superscript: 대기 큐
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/321_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/196_페이지
              - term: Preemptive Scheduling
                description: A scheduling scheme in which the operating system can forcibly take resources, including the CPU, from a process even while it is using them and allocate them to another process.
                superscript: 선점형 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/324_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/198_페이지
              - term: Non-Preemptive Scheduling
                description: A scheduling scheme in which, once a process is using a resource, no other process can intervene until that process terminates or voluntarily enters the blocked state.
                superscript: 비선점형 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/324_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/198_페이지
          - subsubtitle: CPU 스케줄링 알고리즘
            items:
              - term: First-Come, First-Served (FCFS) Scheduling
                description: A non-preemptive scheduling algorithm that processes processes in the order they were inserted into the ready queue.
                superscript: 선입 선처리 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/329_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/199_페이지
              - term: Convoy Effect
                description: A phenomenon in which, when a process with a long CPU usage time arrives first in the ready queue, the processes waiting for it are pushed back.
                superscript: 호위 효과
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/329_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/199_페이지
              - term: Shortest Job First (SJF) Scheduling
                description: A scheduling algorithm that runs the process with the shortest CPU usage time first among the processes inserted into the ready queue.
                superscript: 최단 작업 우선 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/330_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/199_페이지
              - term: Round Robin Scheduling
                description: A scheduling algorithm that adds the concept of a time slice to first-come, first-served scheduling.
                superscript: 라운드 로빈 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/330_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/199_페이지
              - term: Time Slice
                description: The fixed amount of time each process is allowed to use the CPU.
                superscript: 타임 슬라이스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/330_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/199_페이지
              - term: Shortest Remaining Time (SRT) Scheduling
                description: A scheduling algorithm in which processes use the CPU for a fixed time slice, but the process with the least remaining work time is chosen as the next to use the CPU.
                superscript: 최소 잔여 시간 우선 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/331_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/200_페이지
              - term: Priority Scheduling
                description: A scheduling algorithm that assigns priorities to processes and runs the process with the highest priority first.
                superscript: 우선순위 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/332_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/200_페이지
              - term: Starvation
                description: A phenomenon in which a low-priority process keeps having its execution deferred by higher-priority processes.
                superscript: 기아 현상
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/332_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/200_페이지
              - term: Starvation (Alternate Term)
                description: Another word for starvation.
                superscript: 아사 현상
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/332_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/200_페이지
              - term: Aging
                description: A scheme that gradually raises the priority of a process that has waited a long time, to prevent starvation.
                superscript: 에이징
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/332_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/200_페이지
              - term: Multilevel Queue Scheduling
                description: A scheduling algorithm that uses several ready queues, one per priority level.
                superscript: 다단계 큐 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/333_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/200_페이지
                image: assets/img/os/multi_level_queue.png
              - term: Multilevel Feedback Queue Scheduling
                description: A scheduling algorithm in which, within multilevel queue scheduling, a process can move to another queue.
                superscript: 다단계 피드백 큐 스케줄링
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/334_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/201_페이지
                image: assets/img/os/multi_level_feedback_queue.png
              - term: Linux CPU Scheduling
                description: The CPU scheduling scheme used in Linux; various scheduling policies exist.
                superscript: 리눅스 CPU 스케줄링
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/202_페이지
              - term: Completely Fair Scheduler (CFS)
                description: One of the CPU schedulers for general user processes used in Linux; it allocates the CPU based on process weights.
                superscript: CFS 스케줄러
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/203_페이지
      - subtitle: 프로세스 동기화
        content:
          - subsubtitle: 동기화란
            items:
              - term: Synchronization
                description: Letting only one process access a particular resource, or making processes run in the correct order.
                superscript: 동기화
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/340_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/169_페이지
              - term: Mutual Exclusion
                description: A state in which a resource used by one process cannot be used by another; not accessing a non-shareable resource simultaneously.
                superscript: 상호 배제
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/342_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/169_페이지
              - term: Synchronization for Mutual Exclusion
                description: Synchronization that prevents simultaneous access to resources that must not be accessed simultaneously.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/343_페이지
                superscript: 상호 배제를 위한 동기화
              - term: Shared Resource
                description: A resource shared by processes running simultaneously.
                superscript: 공유 자원
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/345_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/165_페이지
              - term: Critical Section
                description: A code region that accesses a resource where problems arise if executed simultaneously.
                superscript: 임계 구역
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/346_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/165_페이지
              - term: Race Condition
                description: A problem that occurs when multiple processes execute critical-section code simultaneously due to incorrect execution.
                superscript: 레이스 컨디션
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/346_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/167_페이지
                image: assets/img/os/race_condition.png
              - term: Bounded Waiting
                description: A principle of synchronization for mutual exclusion that, if there are processes wishing to enter the critical section, a waiting process must be able to enter within a limited number of attempts.
                superscript: 유한 대기
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/348_페이지
          - subsubtitle: 동기화 기법
            items:
              - term: Mutex Lock
                description: A tool that prevents simultaneous access to resources that must not be accessed simultaneously.
                superscript: 뮤텍스 락
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/351_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/170_페이지
              - term: Busy Wait
                description: A waiting scheme in which, when the critical section is locked, a process repeatedly checks whether it can access the critical section until it can.
                superscript: 바쁜 대기
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/353_페이지
              - term: Semaphore
                description: A synchronization tool that can be applied even when there are multiple shared resources.
                superscript: 세마포어
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/353_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/174_페이지
              - term: Monitor
                description: A synchronization tool in which only one process can enter the monitor at a time, through a queue for accessing the interface that handles shared resources (a queue for entering the monitor).
                superscript: 모니터
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/358_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/183_페이지
              - term: Condition Variable
                description: A variable used inside a monitor to control the execution order of processes or threads.
                superscript: 조건 변수
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/359_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/186_페이지
              - term: Thread-Safe
                description: A state in which there is no problem with program execution even when multiple threads run simultaneously.
                superscript: 스레드 안전
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/186_페이지
      - subtitle: 교착 상태
        content:
          - subsubtitle: 교착 상태란
            items:
              - term: Deadlock
                description: A phenomenon in which progress halts while waiting for an event that will never occur.
                superscript: 교착 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/368_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/189_페이지
                image: assets/img/os/deadlock.png
              - term: Resource-Allocation Graph
                description: A simple graph that expresses which process is using which resource and which process is waiting for which resource.
                superscript: 자원 할당 그래프
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/369_페이지
              - term: Conditions for Deadlock
                description: 'A deadlock becomes possible only when all four conditions hold: 1) mutual exclusion, 2) hold and wait, 3) no preemption, and 4) circular wait.'
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/372_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/190_페이지
                superscript: 교착 상태 발생 조건
              - term: Hold and Wait
                description: A state of waiting to be allocated another resource while holding an already allocated resource.
                superscript: 점유와 대기
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/373_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/190_페이지
              - term: Circular Wait
                description: A situation in which processes wait for resources in the form of a circle.
                superscript: 원형 대기
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/373_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/190_페이지
          - subsubtitle: 교착 상태 해결 방법
            items:
              - term: Deadlock Prevention
                description: A method that prevents deadlock by removing one of the conditions for deadlock.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/377_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/191_페이지
                superscript: 교착 상태 예방
              - term: Deadlock Avoidance
                description: A scheme that allocates resources cautiously, only to the extent that deadlock will not occur.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/380_페이지
                superscript: 교착 상태 회피
              - term: Safe State
                description: A state in which deadlock does not occur and all processes can be allocated resources and terminate normally.
                superscript: 안전 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/380_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/192_페이지
              - term: Unsafe State
                description: A state in which deadlock may occur.
                superscript: 불안전 상태
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/380_페이지
              - term: Deadlock Detection and Recovery
                description: A scheme that acknowledges the occurrence of deadlock and takes action afterward.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/384_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/192_페이지
                superscript: 교착 상태 검출 후 회복
              - term: Deadlock Recovery Through Preemption
                description: A scheme that gives resources to one process at a time until the deadlock is resolved.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/384_페이지
                superscript: 선점을 통한 교착 상태 회복
              - term: Deadlock Recovery Through Process Termination
                description: A scheme that forcibly terminates processes until the deadlock is resolved.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/385_페이지
                superscript: 프로세스 강제 종료를 통한 교착 상태 회복
              - term: Ostrich Algorithm
                description: A scheme that deals with rarely occurring potential problems by ignoring them.
                superscript: 타조 알고리즘
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/386_페이지
      - subtitle: 가상 메모리
        content:
          - subsubtitle: 연속 메모리 할당
            items:
              - term: Contiguous Memory Allocation
                description: A scheme that allocates contiguous memory space to a process.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/390_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/208_페이지
                superscript: 연속 메모리 할당
              - term: Swapping
                description: A scheme that temporarily evicts processes to a part of secondary storage and loads and runs another process in the resulting free space in memory.
                superscript: 스와핑
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/207_페이지
                image: assets/img/os/swapping.png
              - term: Swap Space
                description: A part of secondary storage where unused, swapped-out processes are stored.
                superscript: 스왑 영역
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/207_페이지
              - term: Swap-Out
                description: Moving a process that is not currently running from memory to the swap space.
                superscript: 스왑 아웃
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/207_페이지
              - term: Swap-In
                description: Moving a process that was in the swap space back into memory.
                superscript: 스왑 인
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/391_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/207_페이지
              - term: First Fit
                description: A scheme in which the operating system searches the free spaces in memory in order and places the process in the first space it finds that can hold it.
                superscript: 최초 적합
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/393_페이지
              - term: Best Fit
                description: A scheme in which the operating system searches all free spaces and places the process in the smallest space that can hold it.
                superscript: 최적 적합
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/394_페이지
              - term: Worst Fit
                description: A scheme in which the operating system searches all free spaces and places the process in the largest space that can hold it.
                superscript: 최악 적합
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/395_페이지
              - term: External Fragmentation
                description: A phenomenon in which memory is wasted because of free spaces outside processes that are too small to allocate a process to.
                superscript: 외부 단편화
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/396_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/209_페이지
                image: assets/img/os/external_fragmentation.png
              - term: Compaction
                description: A memory management method that relocates the processes stored in memory to merge scattered small free spaces into one large free space.
                superscript: 압축
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/399_페이지
          - subsubtitle: 페이징을 통한 가상 메모리 관리
            items:
              - term: Virtual Memory
                description: A technology that loads only part of a program into memory, enabling the execution of processes larger than the actual physical memory size.
                superscript: 가상 메모리
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/402_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/210_페이지
                image: assets/img/os/virtual_memory.png
              - term: Paging
                description: A virtual memory management technique that cuts a process's logical address space into fixed units called pages, cuts the physical address space into equal-sized units called frames, and then allocates pages to frames.
                superscript: 페이징
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/403_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/210_페이지
                image: assets/img/os/paging.png
              - term: Segmentation
                description: A virtual memory management technique that cuts a process's logical address space into units called segments, cuts the physical address space into units of the same size, and then allocates segments to memory.
                superscript: 세그멘테이션
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/211_페이지
              - term: Page Out
                description: Swap-out in a paging system.
                superscript: 페이지 아웃
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/404_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/212_페이지
              - term: Page In
                description: Swap-in in a paging system.
                superscript: 페이지 인
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/404_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/212_페이지
              - term: Page Table
                description: Table-form information that pairs page numbers with frame numbers to track which page is currently allocated to which frame.
                superscript: 페이지 테이블
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/405_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/213_페이지
                image: assets/img/os/page_table.png
              - term: Internal Fragmentation
                description: A phenomenon of memory waste that occurs because not all processes are divided to fit the page size exactly.
                superscript: 내부 단편화
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/396_페이지
                image: assets/img/os/internal_fragmentation.png
              - term: Page Table Base Register (PTBR)
                description: A register that holds the address where each process's page table is loaded.
                superscript: 페이지 테이블 베이스 레지스터 (PTBR)
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/407_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/217_페이지
              - term: Translation Lookaside Buffer (TLB)
                description: Memory that stores part of the page table to act as a cache for the page table.
                superscript: TLB
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/409_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/215_페이지
                image: assets/img/os/tlb.png
              - term: TLB Hit
                description: The case where the page number for the logical address generated by the CPU is in the TLB.
                superscript: TLB 히트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/409_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/215_페이지
              - term: TLB Miss
                description: The case where the page number for the logical address generated by the CPU is not in the TLB.
                superscript: TLB 미스
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/409_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/215_페이지
              - term: Page Table Entry (PTE)
                description: Each row of the page table.
                superscript: 페이지 테이블 엔트리
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/412_페이지
              - term: Valid Bit
                description: A bit that indicates whether the corresponding page is currently accessible.
                superscript: 유효 비트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/412_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/214_페이지
              - term: Page Fault
                description: An exception that occurs when the CPU tries to access a page whose valid bit is 0 and which is not loaded in memory.
                superscript: 페이지 폴트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/413_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/215_페이지
              - term: Protection Bit
                description: A bit that exists for page protection, indicating whether the page is both readable and writable, or read-only.
                superscript: 보호 비트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/413_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/215_페이지
              - term: Reference Bit
                description: A bit indicating whether the CPU has ever accessed this page.
                superscript: 참조 비트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/414_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/215_페이지
              - term: Modified Bit
                description: A bit indicating whether data has ever been written to the page; also called the dirty bit.
                superscript: 수정 비트
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/415_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/215_페이지
              - term: Copy-on-Write
                description: A scheme in which, right after a parent process creates a child process, if either the parent or the child writes to a page, that page is copied into a separate space and each process points to a frame holding its own page.
                superscript: 쓰기 시 복사
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/417_페이지
              - term: Hierarchical Paging
                description: A method that avoids always keeping all of a process's page table entries in memory; also called a multilevel page table.
                superscript: 계층적 페이징
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/419_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/218_페이지
          - subsubtitle: 페이지 교체와 프레임 할당
            items:
              - term: Demand Paging
                description: A technique that loads only the needed pages into memory rather than loading all pages from the start when loading a process.
                superscript: 요구 페이징
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/425_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/221_페이지
              - term: Pure Demand Paging
                description: A scheme that runs a process with no pages loaded into memory at all.
                superscript: 순수 요구 페이징
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/425_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/221_페이지
              - term: Page Replacement Algorithm
                description: An algorithm that decides which page to evict when a page loaded in memory must be removed to load a page needed for immediate execution.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/425_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/221_페이지
                superscript: 페이지 교체 알고리즘
              - term: Page Reference String
                description: A sequence of pages referenced by the CPU, with consecutive duplicate pages omitted.
                superscript: 페이지 참조열
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/426_페이지
              - term: FIFO Page Replacement Algorithm
                description: A page replacement algorithm that evicts the page that entered memory earliest, replacing pages in the order they were loaded.
                superscript: FIFO 페이지 교체 알고리즘
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/426_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/222_페이지
              - term: Second-Chance Page Replacement Algorithm
                description: A page replacement algorithm that, like FIFO, basically selects the longest-resident page as the one to evict, but if its reference bit is 1, it does not evict it; instead it sets the reference bit to 0 and sets the current time as its load time.
                superscript: 2차 기회 페이지 교체 알고리즘
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/428_페이지
              - term: Optimal Page Replacement Algorithm
                description: A page replacement algorithm that replaces the page with the lowest future usage frequency.
                superscript: 최적 페이지 교체 알고리즘
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/429_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/222_페이지
              - term: Least Recently Used (LRU) Page Replacement Algorithm
                description: A page replacement algorithm that replaces the page that has not been used for the longest time.
                superscript: LRU 페이지 교체 알고리즘
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/430_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/222_페이지
              - term: Thrashing
                description: A performance problem in which a process spends more time on paging than on actual execution.
                superscript: 스레싱
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/431_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/221_페이지
              - term: Major Page Fault
                description: A page fault that requires an I/O operation to read the desired page from secondary storage; it occurs when the page the CPU tries to access is not in physical memory.
                superscript: 메이저 페이지 폴트
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/222_페이지
              - term: Minor Page Fault
                description: A page fault that does not require I/O with secondary storage; it occurs when the page the CPU requested exists in physical memory but is not reflected in the page table.
                superscript: 마이너 페이지 폴트
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/222_페이지
              - term: Degree of Multiprogramming
                description: The number of processes running simultaneously in memory.
                superscript: 멀티프로그래밍의 정도
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/432_페이지
              - term: Equal Allocation
                description: A scheme that allocates frames equally to all processes.
                superscript: 균등 할당
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/433_페이지
              - term: Proportional Allocation
                description: A scheme that distributes frames according to the size of each process.
                superscript: 비례 할당
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/433_페이지
              - term: Static Allocation (Frame Allocation)
                description: A scheme that allocates frames considering only the process size and the physical memory size, without considering the process's execution.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/433_페이지
                superscript: 정적 할당 방식 (프레임 할당)
              - term: Working Set
                description: The set of pages a process has referenced during a certain time while running.
                superscript: 작업 집합
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/434_페이지
              - term: Page-Fault Frequency (PFF)
                description: The frequency of page faults occurring while a process runs.
                superscript: 페이지 폴트 빈도
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/434_페이지
              - term: Dynamic Allocation (Frame Allocation)
                description: A scheme that determines the number of frames by considering the process's execution.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/434_페이지
                superscript: 동적 할당 방식 (프레임 할당)
              - term: Working-Set-Model-Based Frame Allocation
                description: A frame allocation scheme that allocates only as many frames as the size of the working set.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/434_페이지
                superscript: 작업 집합 모델 기반 프레임 할당
              - term: Page-Fault-Rate-Based Frame Allocation
                description: A frame allocation scheme that sets an upper and lower bound on the page-fault rate and allocates frames only within that range.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/436_페이지
                superscript: 페이지 폴트율 기반 프레임 할당
      - subtitle: 파일 시스템
        content:
          - subsubtitle: 파일과 디렉터리
            items:
              - term: File
                description: A collection of related information stored on secondary storage such as a hard disk or SSD.
                superscript: 파일
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/441_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/223_페이지
              - term: Attribute
                description: Additional information related to a file; also called metadata.
                superscript: 속성
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/441_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/223_페이지
              - term: File Attributes
                description: Various information related to a file, such as file type, location, and size.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/441_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/223_페이지
                superscript: 파일 속성
              - term: File Descriptor
                description: A number the operating system assigns to identify a file.
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/225_페이지
                superscript: 파일 디스크립터
              - term: File Type
                description: A kind of file recognized by the operating system, identifiable by its extension.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/442_페이지
                superscript: 파일 유형
              - term: File Location
                description: The current location of a file on secondary storage.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/442_페이지
                superscript: 파일 위치
              - term: Directory
                description: A space for storing files; called a folder in the Windows operating system.
                superscript: 디렉터리
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/443_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/226_페이지
              - term: Tree-Structured Directory
                description: A scheme in which directories are connected in a multi-level tree structure.
                superscript: 트리 구조 디렉터리
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/443_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/227_페이지
                image: assets/img/os/tree_directory.png
              - term: Root Directory
                description: The topmost directory of a tree-structured directory.
                superscript: 루트 디렉터리
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/444_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/227_페이지
              - term: Path
                description: Information that uses directories to specify a file's location and name.
                superscript: 경로
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/444_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/227_페이지
              - term: Absolute Path
                description: The unique path from the root directory to the file itself.
                superscript: 절대 경로
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/444_페이지
              - term: Relative Path
                description: The path from the current directory to the file itself.
                superscript: 상대 경로
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/445_페이지
              - term: Directory Entry
                description: Information about the files and directories stored in a directory.
                superscript: 디렉터리 엔트리
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/227_페이지
          - subsubtitle: 파일 시스템
            items:
              - term: File System
                description: A program inside the operating system that stores files and directories neatly on secondary storage and allows access to them.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/452_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/223_페이지
                superscript: 파일 시스템
              - term: Partitioning
                description: The task of dividing the logical regions of a storage device.
                superscript: 파티셔닝
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/453_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/231_페이지
              - term: Partition
                description: A region created by partitioning.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/453_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/231_페이지
                superscript: 파티션
              - term: Formatting
                description: The task of setting up a file system and preparing to write new data.
                superscript: 포맷팅
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/454_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/232_페이지
              - term: Low-Level Formatting
                description: Physical formatting performed at the factory when the storage device is created.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/454_페이지
                superscript: 저수준 포매팅
              - term: Logical Formatting
                description: Formatting that creates a file system.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/454_페이지
                superscript: 논리적 포매팅
              - term: Block
                description: The smallest unit in which a file system (operating system) stores files.
                superscript: 블록
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/456_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/229_페이지
              - term: Contiguous Allocation
                description: A file allocation scheme that allocates blocks so a file occupies contiguous space within the storage device.
                superscript: 연속 할당
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/457_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/230_페이지
              - term: Linked Allocation
                description: A file allocation scheme that stores the address of another block in part of each block, so each block points to its next block.
                superscript: 연결 할당
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/458_페이지
              - term: Random Access (Speed)
                description: The speed of accessing an arbitrary location in the data.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/459_페이지
                superscript: 임의 접근 속도
              - term: Indexed Allocation
                description: A file allocation scheme that gathers and manages all of a file's block addresses in an index block.
                superscript: 색인 할당
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/460_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/230_페이지
                image: assets/img/os/index_allocation.png
              - term: Index Block
                description: A special block that gathers all of a file's block addresses.
                superscript: 색인 블록
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/460_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/230_페이지
              - term: File Allocation Table (FAT)
                description: A table that gathers the addresses of the next block contained in each block.
                superscript: 파일 할당 테이블 (FAT)
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/462_페이지
              - term: FAT File System
                description: A file system that uses the FAT.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/463_페이지
                superscript: FAT 파일 시스템
              - term: Cluster (File System)
                description: The term used in Windows instead of 'block'.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/463_페이지
                superscript: 클러스터 (파일 시스템)
              - term: UNIX File System
                description: A file system based on indexed allocation that uses an index block called an i-node as its index block.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/461_페이지
                superscript: 유닉스 파일 시스템
              - term: Indexed Allocation
                description: A scheme that finds a file's data blocks based on an index block.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/467_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/230_페이지
                superscript: 색인 할당
              - term: i-node (Index Node)
                description: The index block in the UNIX file system; it can store file attribute information and the locations of file data.
                superscript: 아이노드 (i-node)
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/467_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/233_페이지
              - term: Direct Block
                description: An i-node block in which file data is stored.
                superscript: 직접 블록
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/468_페이지
              - term: Hard Link File
                description: A file that shares the same i-node as the original file.
                superscript: 하드 링크 파일
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/235_페이지
                image: assets/img/os/hard_link.png
              - term: Symbolic Link
                description: A file that points to the address of the original file.
                superscript: 심볼릭 링크
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/235_페이지
                image: assets/img/os/symbolic_link.png
              - term: Single Indirect Block
                description: An i-node block that stores the addresses of blocks holding file data, rather than the data blocks themselves.
                superscript: 단일 간접 블록
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/468_페이지
              - term: Double Indirect Block
                description: An i-node block that stores the addresses of blocks that store data-block addresses (an i-node block storing the addresses of single indirect blocks).
                superscript: 이중 간접 블록
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/469_페이지
              - term: Triple Indirect Block
                description: An i-node block that stores the addresses of double indirect blocks.
                superscript: 삼중 간접 블록
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/469_페이지
              - term: NT File System (NTFS)
                description: The file system used by the Windows operating system.
                superscript: NT 파일 시스템
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/474_페이지
              - term: ext File System
                description: The file system mainly used by the Linux operating system.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/474_페이지
                superscript: ext 파일 시스템
              - term: System Crash
                description: A situation in which the computer is forcibly shut down due to a sudden power loss or a fatal error while working.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/475_페이지
                superscript: 시스템 크래시
              - term: Journaling File System
                description: A file system that uses the journaling technique.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/475_페이지
                superscript: 저널링 파일 시스템
              - term: Journaling
                description: A file system technology that leaves work logs before and after file system changes and quickly recovers based on those logs when a system crash occurs.
                superscript: 저널링 기법
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/475_페이지
              - term: Mount
                description: The task of incorporating one storage device's file system so that another storage device's file system can access it.
                references:
                  - 혼자_공부하는_컴퓨터구조_운영체제/476_페이지
                  - 이것이_취업을_위한_컴퓨터과학이다/236_페이지
                superscript: 마운트
              - term: Booting
                description: The task of turning on the computer and loading the operating system into memory.
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/239_페이지
                superscript: 부팅
              - term: BIOS (Basic Input/Output System)
                description: The first program that runs when the computer is powered on; it performs the computer's basic I/O operations.
                superscript: 바이오스
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/239_페이지
                image: assets/img/os/bios.png
              - term: Power-On Self-Test (POST)
                description: The task of checking the basic operation of the hardware during booting.
                superscript: POST (부팅)
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/239_페이지
              - term: Master Boot Record
                description: The region that the BIOS reads from secondary storage in order to boot.
                superscript: 마스터 부트 레코드
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/239_페이지
              - term: Boot Loader
                description: A program that loads the operating system into memory during the computer's boot process.
                superscript: 부트로더
                references:
                  - 이것이_취업을_위한_컴퓨터과학이다/239_페이지
